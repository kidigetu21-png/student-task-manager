<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Task Manager</h1>
        <p>Organize your studies. Achieve your goals.</p>
    </header>

    <main>

        <!-- Task Summary -->
        <section class="summary">

            <div class="card">
                <h3>Total Tasks</h3>
                <p id="total-tasks">0</p>
            </div>

            <div class="card">
                <h3>Pending Tasks</h3>
                <p id="pending-tasks">0</p>
            </div>

            <div class="card">
                <h3>Completed Tasks</h3>
                <p id="completed-tasks">0</p>
            </div>

        </section>

        <!-- Add Task Form -->
        <section class="form-section">

            <h2>Add a New Task</h2>

            <form id="task-form">

                <label for="task-title">Task Title</label>
                <input
                    type="text"
                    id="task-title"
                    placeholder="e.g. Study JavaScript"
                    required
                >

                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    placeholder="Enter task details"
                    rows="3"
                ></textarea>

                <label for="task-date">Due Date</label>
                <input
                    type="date"
                    id="task-date"
                    required
                >

                <label for="task-priority">Priority</label>
                <select id="task-priority">
                    <option value="Low">Low</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="High">High</option>
                </select>

                <button type="submit">Add Task</button>

            </form>

        </section>

        <!-- Task List -->
        <section class="tasks-section">

            <h2>My Tasks</h2>

            <div class="filters">

                <label for="task-filter">Filter tasks:</label>

                <select id="task-filter">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>

            </div>

            <ul id="task-list">
                
            </ul>

        </section>

    </main>

    <footer>
        <p>Student Task Manager | Built with HTML, CSS & JavaScript</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
